<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResolveIT — Login & Registration</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      background: var(--bg-surface);
      border: none;
      transition: var(--transition);
    }
    .auth-tab.active {
      background: var(--bg-card);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    .auth-body {
      padding: 2rem;
    }
    .demo-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: #eff6ff;
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
    }
    .demo-btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <span>ResolveIT</span>
      </a>
      <a href="index.html" class="nav-link">← Back to Home</a>
    </div>
  </nav>

  <!-- Auth Content -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchTab('login')">Sign In</button>
        <button id="tab-register" class="auth-tab" onclick="switchTab('register')">Student Register</button>
      </div>

      <div class="auth-body">
        <!-- LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">College Email Address</label>
            <input type="email" id="login-email" placeholder="e.g. shruti.pagare@college.edu" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="e.g. Shruti Pagare" required>
          </div>
          <div class="form-group">
            <label for="reg-email">College Email Address</label>
            <input type="email" id="reg-email" placeholder="e.g. student@college.edu" required>
          </div>
          <div class="form-group">
            <label for="reg-dept">Academic Department</label>
            <select id="reg-dept" required>
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Telecommunication">Electronics & Telecommunication</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="First Year Engineering">First Year Engineering</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <!-- Viva & Demonstration Fast Logins -->
        <div class="demo-box">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; gap: 6px;">
            <span>⚡ Viva / Demonstration Fast Login</span>
          </div>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">
            One-click test authentication for evaluating Student and Administrator portals instantly:
          </p>
          <div class="demo-btn-group">
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="window.AuthModule.quickLogin('student')">
              👤 Student Demo
            </button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="window.AuthModule.quickLogin('admin')">
              🛡️ Admin Demo
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function switchTab(tab) {
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");

      if (tab === "register") {
        tabLogin.classList.remove("active");
        tabRegister.classList.add("active");
        formLogin.style.display = "none";
        formRegister.style.display = "block";
      } else {
        tabRegister.classList.remove("active");
        tabLogin.classList.add("active");
        formRegister.style.display = "none";
        formLogin.style.display = "block";
      }
    }

    // Check URL query for tab
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("tab") === "register") {
      switchTab("register");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-password").value;

      const res = await window.AuthModule.loginUser(email, pass);
      if (res.success) {
        window.AppEngine.showToast("Signed in successfully!", "success");
        setTimeout(() => {
          window.location.href = res.user.role === "admin" ? "admin.html" : "dashboard.html";
        }, 500);
      } else {
        alert(res.message || "Failed to sign in. Please verify credentials.");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const dept = document.getElementById("reg-dept").value;
      const pass = document.getElementById("reg-password").value;

      const res = await window.AuthModule.registerUser(name, email, pass, dept);
      if (res.success) {
        window.AppEngine.showToast("Registration successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 600);
      } else {
        alert(res.message || "Registration failed.");
      }
    }
  </script>
</body>
</html>
